stages:
  - build

variables:
  # Use the latest Go image
  GO_VERSION: "golang:latest"

build_macos_arm:
  stage: build
  image: $GO_VERSION
  script:
    - echo "Building for macOS ARM..."
    - GOOS=darwin GOARCH=arm64 go build -o strip_pcap_mac_arm64 strip_pcap.go
  artifacts:
    paths:
      - strip_pcap_mac_arm64

build_macos_x86:
  stage: build
  image: $GO_VERSION
  script:
    - echo "Building for macOS x86..."
    - GOOS=darwin GOARCH=amd64 go build -o strip_pcap_mac_x86 strip_pcap.go
  artifacts:
    paths:
      - strip_pcap_mac_x86

build_linux_x86:
  stage: build
  image: $GO_VERSION
  script:
    - echo "Building for Linux x86..."
    - GOOS=linux GOARCH=386 go build -o strip_pcap_linux_x86 strip_pcap.go
  artifacts:
    paths:
      - strip_pcap_linux_x86

build_windows_x86:
  stage: build
  image: $GO_VERSION
  script:
    - echo "Building for Windows x86..."
    - GOOS=windows GOARCH=386 go build -o strip_pcap_win_x86.exe strip_pcap.go
  artifacts:
    paths:
      - strip_pcap_win_x86.exe
