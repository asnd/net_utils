image: golang:latest

stages:
  - build

variables:
  PACKAGE_NAME: pcap-stripper

build:
  stage: build
  script:
    - mkdir -p build
    - GOOS=linux GOARCH=amd64 go build -o build/${PACKAGE_NAME}-linux-amd64 pcap_stripper.go
    - GOOS=linux GOARCH=arm64 go build -o build/${PACKAGE_NAME}-linux-arm64 pcap_stripper.go
    - GOOS=windows GOARCH=amd64 go build -o build/${PACKAGE_NAME}-windows-amd64.exe pcap_stripper.go
  artifacts:
    paths:
      - build/