stages:
  - setup
  - build
  - test

variables:
  # Ensure the Go modules cache is used
  GOPATH: "$CI_PROJECT_DIR"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - vendor/
    - .cache/go-build
    - pkg/mod

before_script:
  - go version

setup_module:
  stage: setup
  image: golang:1.20-bullseye
  script:
    - echo "Initializing Go module"
    - go mod init strip_pcap
    - go get github.com/google/gopacket
    - go mod tidy
  artifacts:
    paths:
      - go.mod
      - go.sum
      - vendor/
      - .cache/go-build
      - pkg/mod

build_linux:
  stage: build
  image: golang:1.20-bullseye
  needs:
    - setup_module
  script:
    - echo "Building on Linux x86"
    - GOOS=linux GOARCH=386 go build -o strip_pcap_linux_x86 strip_pcap.go
  artifacts:
    paths:
      - strip_pcap_linux_x86

