# GitHub Actions CI/CD for net_utils
# Builds pcap_stripper for multiple platforms

name: Build

on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
    branches: [master, main]

env:
  PACKAGE_NAME: pcap_stripper
  CGO_ENABLED: "1"

jobs:
  # ====================================================================================
  # PREPARE
  # ====================================================================================
  download-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Download Go modules
        run: |
          go mod download
          go mod verify

  # ====================================================================================
  # BUILD STAGE
  # ====================================================================================
  build-linux-x64:
    runs-on: ubuntu-latest
    needs: download-dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Build for Linux x64
        run: |
          mkdir -p build
          go build -o build/${PACKAGE_NAME}-linux-amd64 ./cmd/pcap_stripper
          chmod +x build/${PACKAGE_NAME}-linux-amd64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: build/${PACKAGE_NAME}-linux-amd64
          retention-days: 30

  build-windows-x64:
    runs-on: ubuntu-latest
    needs: download-dependencies
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 libpcap-dev
      - name: Build for Windows x64
        run: |
          mkdir -p build
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
            go build -o build/${PACKAGE_NAME}-windows-amd64.exe ./cmd/pcap_stripper
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: build/${PACKAGE_NAME}-windows-amd64.exe
          retention-days: 30

  build-macos-arm64:
    runs-on: ubuntu-latest
    needs: download-dependencies
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libpcap-dev
      - name: Build for macOS ARM64
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 CC=clang \
            go build -o build/${PACKAGE_NAME}-macos-arm64 ./cmd/pcap_stripper
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/${PACKAGE_NAME}-macos-arm64
          retention-days: 30

  # ====================================================================================
  # PACKAGE & RELEASE
  # ====================================================================================
  package-all:
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-windows-x64, build-macos-arm64]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts
      - name: Create release package
        run: |
          mkdir -p release
          cp -r build-artifacts/*/* release/ 2>/dev/null || true
          cd release
          sha256sum * > SHA256SUMS.txt || true
          cat > README.txt << EOF
          PCAP Stripper - Multi-Platform Release
          Version: ${GITHUB_REF_NAME}
          EOF
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/
          retention-days: 90

  create-release:
    runs-on: ubuntu-latest
    needs: package-all
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body: |
            PCAP Stripper release ${{ github.ref_name }}

            Multi-platform binaries included.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
