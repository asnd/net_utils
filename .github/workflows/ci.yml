name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scapy pytest

    - name: Run Python tests
      run: |
        python -m pytest test_pcap_stripper.py -v

    - name: Check Python syntax
      run: |
        python -m py_compile pcap_stripper.py
        python -m py_compile DNS_checker.py

  go-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Initialize Go module
      run: |
        go mod init strip_pcap || true
        go get github.com/google/gopacket/pcapgo
        go mod tidy

    - name: Build Go binaries
      run: |
        go build -o strip_pcap strip_pcap.go
        go build -o dns_query dns_query.go

    - name: Verify binaries
      run: |
        file strip_pcap
        file dns_query
